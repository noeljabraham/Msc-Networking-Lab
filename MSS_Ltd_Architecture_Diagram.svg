<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">MSS Ltd Secure LAN Architecture</title>
  <desc id="desc">Hierarchical Cisco Packet Tracer architecture with ISP, edge router, redundant core switches, floor access switches, departmental VLANs, server farm, management VLAN, and backup VLAN.</desc>
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #4b5563; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #111827; }
      .box-text { font: 400 15px Arial, sans-serif; fill: #374151; }
      .small { font: 400 13px Arial, sans-serif; fill: #4b5563; }
      .edge { fill: #f9fafb; stroke: #374151; stroke-width: 2; }
      .core { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 3; }
      .access { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }
      .user { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
      .server { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; }
      .security { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
      .line { stroke: #374151; stroke-width: 3; fill: none; }
      .trunk { stroke: #1f2937; stroke-width: 4; fill: none; }
      .backup { stroke: #6b7280; stroke-width: 3; fill: none; stroke-dasharray: 9 8; }
      .label { font: 700 13px Arial, sans-serif; fill: #111827; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="1050" fill="#ffffff"/>
  <text x="60" y="58" class="title">MSS Ltd Secure LAN Architecture</text>
  <text x="60" y="88" class="subtitle">Cisco Packet Tracer design for three floors, departmental VLANs, server farm, Internet access, security controls, and redundancy</text>

  <!-- Internet edge -->
  <ellipse cx="800" cy="150" rx="105" ry="42" class="edge"/>
  <text x="800" y="145" text-anchor="middle" class="box-title">Internet / ISP</text>
  <text x="800" y="168" text-anchor="middle" class="box-text">External network</text>

  <rect x="660" y="230" width="280" height="78" rx="8" class="edge"/>
  <text x="800" y="258" text-anchor="middle" class="box-title">ISP-R1</text>
  <text x="800" y="282" text-anchor="middle" class="box-text">ISP router / test Internet</text>

  <rect x="660" y="360" width="280" height="90" rx="8" class="edge"/>
  <text x="800" y="389" text-anchor="middle" class="box-title">EDGE-R1</text>
  <text x="800" y="413" text-anchor="middle" class="box-text">NAT, default route</text>
  <text x="800" y="436" text-anchor="middle" class="box-text">outside connection</text>

  <rect x="660" y="505" width="280" height="82" rx="8" class="security"/>
  <text x="800" y="535" text-anchor="middle" class="box-title">Firewall / Edge ACLs</text>
  <text x="800" y="559" text-anchor="middle" class="box-text">filter traffic and protect LAN</text>

  <path d="M800 192 L800 230" class="line"/>
  <path d="M800 308 L800 360" class="line"/>
  <path d="M800 450 L800 505" class="line"/>

  <!-- Core -->
  <rect x="500" y="655" width="260" height="105" rx="8" class="core"/>
  <text x="630" y="688" text-anchor="middle" class="box-title">CORE-SW1</text>
  <text x="630" y="713" text-anchor="middle" class="box-text">Multilayer switch</text>
  <text x="630" y="737" text-anchor="middle" class="box-text">SVIs + inter-VLAN routing</text>

  <rect x="840" y="655" width="260" height="105" rx="8" class="core"/>
  <text x="970" y="688" text-anchor="middle" class="box-title">CORE-SW2</text>
  <text x="970" y="713" text-anchor="middle" class="box-text">Redundant core</text>
  <text x="970" y="737" text-anchor="middle" class="box-text">dual uplink failover</text>

  <path d="M800 587 L630 655" class="trunk"/>
  <path d="M800 587 L970 655" class="backup"/>
  <path d="M760 707 L840 707" class="trunk"/>
  <text x="800" y="695" text-anchor="middle" class="label">core link</text>

  <!-- Access layer -->
  <rect x="80" y="845" width="245" height="90" rx="8" class="access"/>
  <text x="202" y="877" text-anchor="middle" class="box-title">SW-F1-MKT</text>
  <text x="202" y="902" text-anchor="middle" class="box-text">Floor 1 access switch</text>
  <text x="202" y="925" text-anchor="middle" class="box-text">VLAN 10</text>

  <rect x="390" y="845" width="245" height="90" rx="8" class="access"/>
  <text x="512" y="877" text-anchor="middle" class="box-title">SW-F2-SALES</text>
  <text x="512" y="902" text-anchor="middle" class="box-text">Floor 2 access switch</text>
  <text x="512" y="925" text-anchor="middle" class="box-text">VLAN 20</text>

  <rect x="700" y="845" width="245" height="90" rx="8" class="access"/>
  <text x="822" y="877" text-anchor="middle" class="box-title">SW-F3-SUPPORT</text>
  <text x="822" y="902" text-anchor="middle" class="box-text">Floor 3 access switch</text>
  <text x="822" y="925" text-anchor="middle" class="box-text">VLAN 30 + admin PC</text>

  <rect x="1105" y="845" width="280" height="90" rx="8" class="access"/>
  <text x="1245" y="877" text-anchor="middle" class="box-title">SW-SERVER</text>
  <text x="1245" y="902" text-anchor="middle" class="box-text">Server farm switch</text>
  <text x="1245" y="925" text-anchor="middle" class="box-text">VLAN 40 / 50 / 60</text>

  <!-- Uplinks -->
  <path d="M565 760 L202 845" class="trunk"/>
  <path d="M905 760 L202 845" class="backup"/>
  <path d="M610 760 L512 845" class="trunk"/>
  <path d="M930 760 L512 845" class="backup"/>
  <path d="M670 760 L822 845" class="trunk"/>
  <path d="M970 760 L822 845" class="backup"/>
  <path d="M740 760 L1245 845" class="trunk"/>
  <path d="M1015 760 L1245 845" class="backup"/>

  <!-- User groups -->
  <rect x="55" y="970" width="295" height="55" rx="8" class="user"/>
  <text x="202" y="993" text-anchor="middle" class="box-title">Marketing PCs x20</text>
  <text x="202" y="1016" text-anchor="middle" class="small">192.168.10.0/27, gateway 192.168.10.1</text>

  <rect x="365" y="970" width="295" height="55" rx="8" class="user"/>
  <text x="512" y="993" text-anchor="middle" class="box-title">Sales PCs x25</text>
  <text x="512" y="1016" text-anchor="middle" class="small">192.168.20.0/26, gateway 192.168.20.1</text>

  <rect x="675" y="970" width="295" height="55" rx="8" class="user"/>
  <text x="822" y="993" text-anchor="middle" class="box-title">Support PCs x15 + Admin PC</text>
  <text x="822" y="1016" text-anchor="middle" class="small">192.168.30.0/27 and management VLAN 50</text>

  <path d="M202 935 L202 970" class="line"/>
  <path d="M512 935 L512 970" class="line"/>
  <path d="M822 935 L822 970" class="line"/>

  <!-- Server block -->
  <rect x="1025" y="960" width="440" height="72" rx="8" class="server"/>
  <text x="1245" y="986" text-anchor="middle" class="box-title">Server Farm</text>
  <text x="1245" y="1010" text-anchor="middle" class="small">DNS, mail, intranet, departmental DBs, backup DB, archive server</text>
  <path d="M1245 935 L1245 960" class="line"/>

  <!-- VLAN legend -->
  <rect x="1125" y="120" width="390" height="260" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
  <text x="1150" y="155" class="box-title">VLAN and Subnet Summary</text>
  <text x="1150" y="188" class="box-text">VLAN 10 Marketing: 192.168.10.0/27</text>
  <text x="1150" y="218" class="box-text">VLAN 20 Sales: 192.168.20.0/26</text>
  <text x="1150" y="248" class="box-text">VLAN 30 Support: 192.168.30.0/27</text>
  <text x="1150" y="278" class="box-text">VLAN 40 Servers: 192.168.40.0/27</text>
  <text x="1150" y="308" class="box-text">VLAN 50 Management: 192.168.50.0/28</text>
  <text x="1150" y="338" class="box-text">VLAN 60 Backup: 192.168.60.0/28</text>
  <text x="1150" y="365" class="small">Use ACLs to restrict backup and management access.</text>

  <!-- Link legend -->
  <line x1="95" y1="130" x2="175" y2="130" class="trunk"/>
  <text x="190" y="136" class="box-text">Primary trunk/uplink</text>
  <line x1="95" y1="170" x2="175" y2="170" class="backup"/>
  <text x="190" y="176" class="box-text">Redundant/backup path</text>
</svg>
