<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500" role="img" aria-labelledby="title desc">
  <title id="title">MSS Ltd Implemented Secure LAN Architecture</title>
  <desc id="desc">The implemented Packet Tracer topology with an external test server, ISP and edge routers, two core switches, five dual-connected access switches, three departmental VLANs, management VLAN, production servers, and protected backup servers.</desc>
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #4b5563; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #111827; }
      .box-text { font: 400 15px Arial, sans-serif; fill: #374151; }
      .small { font: 400 13px Arial, sans-serif; fill: #4b5563; }
      .label { font: 700 13px Arial, sans-serif; fill: #111827; }
      .external { fill: #f9fafb; stroke: #374151; stroke-width: 2; }
      .core { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 3; }
      .access { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }
      .user { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
      .server { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; }
      .management { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
      .native { fill: #f3f4f6; stroke: #6b7280; stroke-width: 2; }
      .line { stroke: #374151; stroke-width: 3; fill: none; }
      .trunk { stroke: #1f2937; stroke-width: 4; fill: none; }
      .redundant { stroke: #6b7280; stroke-width: 3; fill: none; stroke-dasharray: 9 8; }
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="1500" fill="#ffffff"/>
  <text x="50" y="55" class="title">MSS Ltd Implemented Secure LAN Architecture</text>
  <text x="50" y="85" class="subtitle">Exact Packet Tracer design: Internet edge, dual core, five access switches, three floors, server room, management, and protected backup VLAN</text>

  <!-- Internet and WAN -->
  <rect x="720" y="115" width="360" height="82" rx="8" class="external"/>
  <text x="900" y="145" text-anchor="middle" class="box-title">INTERNET-SRV</text>
  <text x="900" y="170" text-anchor="middle" class="box-text">External test server - 198.51.100.10/24</text>

  <rect x="720" y="260" width="360" height="82" rx="8" class="external"/>
  <text x="900" y="290" text-anchor="middle" class="box-title">ISP-R1 - 2911 Router</text>
  <text x="900" y="315" text-anchor="middle" class="box-text">G0/1: 198.51.100.1/24</text>

  <rect x="720" y="405" width="360" height="95" rx="8" class="external"/>
  <text x="900" y="435" text-anchor="middle" class="box-title">EDGE-R1 - 2911 Router</text>
  <text x="900" y="460" text-anchor="middle" class="box-text">NAT overload and default route</text>
  <text x="900" y="483" text-anchor="middle" class="small">MSS Ltd network edge</text>

  <path d="M900 197 L900 260" class="line"/>
  <rect x="925" y="212" width="235" height="28" rx="4" fill="#ffffff"/>
  <text x="938" y="231" class="label">Public LAN - 198.51.100.0/24</text>

  <path d="M900 342 L900 405" class="line"/>
  <rect x="925" y="357" width="220" height="28" rx="4" fill="#ffffff"/>
  <text x="938" y="376" class="label">WAN link - 203.0.113.0/30</text>

  <!-- Core layer -->
  <rect x="600" y="565" width="600" height="32" rx="4" fill="#ffffff"/>
  <text x="900" y="586" text-anchor="middle" class="label">Core / Distribution Layer - HSRP, Rapid PVST+ and Inter-VLAN Routing</text>

  <rect x="400" y="610" width="380" height="110" rx="8" class="core"/>
  <text x="590" y="642" text-anchor="middle" class="box-title">CORE-SW1 - 3560-24PS</text>
  <text x="590" y="667" text-anchor="middle" class="box-text">SVIs, HSRP and inter-VLAN routing</text>
  <text x="590" y="692" text-anchor="middle" class="small">Fa0/24: 10.255.0.1/30</text>

  <rect x="1020" y="610" width="380" height="110" rx="8" class="core"/>
  <text x="1210" y="642" text-anchor="middle" class="box-title">CORE-SW2 - 3560-24PS</text>
  <text x="1210" y="667" text-anchor="middle" class="box-text">SVIs, HSRP and inter-VLAN routing</text>
  <text x="1210" y="692" text-anchor="middle" class="small">Fa0/24: 10.255.0.5/30</text>

  <path d="M850 500 L590 610" class="trunk"/>
  <text x="335" y="525" class="label">10.255.0.0/30</text>
  <text x="335" y="547" class="small">EDGE G0/0 to CORE-SW1 Fa0/24</text>

  <path d="M950 500 L1210 610" class="trunk"/>
  <text x="1250" y="525" class="label">10.255.0.4/30</text>
  <text x="1250" y="547" class="small">EDGE G0/1 to CORE-SW2 Fa0/24</text>

  <path d="M780 665 L1020 665" class="trunk"/>
  <rect x="795" y="625" width="210" height="28" rx="4" fill="#ffffff"/>
  <text x="900" y="644" text-anchor="middle" class="label">Gi0/1 802.1Q core trunk</text>
  <!-- Access layer -->
  <rect x="30" y="860" width="300" height="105" rx="8" class="access"/>
  <text x="180" y="892" text-anchor="middle" class="box-title">SW-MKT</text>
  <text x="180" y="917" text-anchor="middle" class="box-text">2960-24TT - Floor 1</text>
  <text x="180" y="942" text-anchor="middle" class="small">Marketing access switch</text>

  <rect x="380" y="860" width="300" height="105" rx="8" class="access"/>
  <text x="530" y="892" text-anchor="middle" class="box-title">SW-SALES-A</text>
  <text x="530" y="917" text-anchor="middle" class="box-text">2960-24TT - Floor 2</text>
  <text x="530" y="942" text-anchor="middle" class="small">Sales PCs 01-24</text>

  <rect x="730" y="860" width="300" height="105" rx="8" class="access"/>
  <text x="880" y="892" text-anchor="middle" class="box-title">SW-SALES-B</text>
  <text x="880" y="917" text-anchor="middle" class="box-text">2960-24TT - Floor 2</text>
  <text x="880" y="942" text-anchor="middle" class="small">Sales PC 25 and future growth</text>

  <rect x="1080" y="860" width="300" height="105" rx="8" class="access"/>
  <text x="1230" y="892" text-anchor="middle" class="box-title">SW-SUPPORT</text>
  <text x="1230" y="917" text-anchor="middle" class="box-text">2960-24TT - Floor 3</text>
  <text x="1230" y="942" text-anchor="middle" class="small">General Support access switch</text>

  <rect x="1430" y="860" width="300" height="105" rx="8" class="access"/>
  <text x="1580" y="892" text-anchor="middle" class="box-title">SW-SERVER</text>
  <text x="1580" y="917" text-anchor="middle" class="box-text">2960-24TT - Server Room</text>
  <text x="1580" y="942" text-anchor="middle" class="small">VLANs 40, 50 and 60</text>

  <!-- Dual uplinks from both cores -->
  <path d="M470 720 L180 860" class="trunk"/>
  <path d="M1070 720 L180 860" class="redundant"/>
  <path d="M525 720 L530 860" class="trunk"/>
  <path d="M1120 720 L530 860" class="redundant"/>
  <path d="M590 720 L880 860" class="trunk"/>
  <path d="M1170 720 L880 860" class="redundant"/>
  <path d="M655 720 L1230 860" class="trunk"/>
  <path d="M1230 720 L1230 860" class="redundant"/>
  <path d="M720 720 L1580 860" class="trunk"/>
  <path d="M1320 720 L1580 860" class="redundant"/>

  <!-- Backplated annotations are drawn after the uplinks so cables do not cross the text -->
  <rect x="665" y="732" width="470" height="28" rx="4" fill="#ffffff"/>
  <text x="900" y="751" text-anchor="middle" class="small">VLANs 10, 20, 30, 40, 50, 60 and native VLAN 99</text>
  <rect x="595" y="775" width="610" height="30" rx="4" fill="#ffffff"/>
  <text x="900" y="795" text-anchor="middle" class="label">Access Layer - every switch has primary and redundant 802.1Q uplinks</text>

  <!-- Department groups -->
  <rect x="30" y="1050" width="300" height="105" rx="8" class="user"/>
  <text x="180" y="1082" text-anchor="middle" class="box-title">Floor 1 - Marketing</text>
  <text x="180" y="1107" text-anchor="middle" class="box-text">20 PCs - VLAN 10</text>
  <text x="180" y="1132" text-anchor="middle" class="small">192.168.10.0/27 - Gateway .1</text>
  <path d="M180 965 L180 1050" class="line"/>

  <rect x="380" y="1050" width="650" height="105" rx="8" class="user"/>
  <text x="705" y="1082" text-anchor="middle" class="box-title">Floor 2 - Sales</text>
  <text x="705" y="1107" text-anchor="middle" class="box-text">25 PCs across SW-SALES-A and SW-SALES-B - VLAN 20</text>
  <text x="705" y="1132" text-anchor="middle" class="small">192.168.20.0/26 - Gateway 192.168.20.1</text>
  <path d="M530 965 L530 1050" class="line"/>
  <path d="M880 965 L880 1050" class="line"/>

  <rect x="1080" y="1050" width="300" height="105" rx="8" class="user"/>
  <text x="1230" y="1082" text-anchor="middle" class="box-title">Floor 3 - General Support</text>
  <text x="1230" y="1107" text-anchor="middle" class="box-text">15 PCs - VLAN 30</text>
  <text x="1230" y="1132" text-anchor="middle" class="small">192.168.30.0/27 - Gateway .1</text>
  <path d="M1230 965 L1230 1050" class="line"/>

  <!-- Server room -->
  <rect x="1410" y="1025" width="360" height="405" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="1590" y="1057" text-anchor="middle" class="box-title">Server Room / Server Farm</text>
  <path d="M1580 965 L1580 1025" class="line"/>

  <rect x="1435" y="1080" width="310" height="82" rx="8" class="server"/>
  <text x="1590" y="1107" text-anchor="middle" class="box-title">Production Services - VLAN 40</text>
  <text x="1590" y="1131" text-anchor="middle" class="small">INFRA .10, MAIL .11, INTRANET .12</text>
  <text x="1590" y="1151" text-anchor="middle" class="small">192.168.40.0/27</text>

  <rect x="1435" y="1180" width="310" height="82" rx="8" class="server"/>
  <text x="1590" y="1207" text-anchor="middle" class="box-title">Department Databases - VLAN 40</text>
  <text x="1590" y="1231" text-anchor="middle" class="small">Marketing .20, Sales .21, Support .22</text>
  <text x="1590" y="1251" text-anchor="middle" class="small">Reachable by all departments</text>

  <rect x="1435" y="1280" width="150" height="120" rx="8" class="management"/>
  <text x="1510" y="1308" text-anchor="middle" class="box-title">ADMIN-PC</text>
  <text x="1510" y="1332" text-anchor="middle" class="small">VLAN 50</text>
  <text x="1510" y="1354" text-anchor="middle" class="small">192.168.50.0/28</text>
  <text x="1510" y="1376" text-anchor="middle" class="small">Gateway .1</text>

  <rect x="1595" y="1280" width="150" height="120" rx="8" class="server"/>
  <text x="1670" y="1308" text-anchor="middle" class="box-title">Backup VLAN</text>
  <text x="1670" y="1332" text-anchor="middle" class="small">VLAN 60</text>
  <text x="1670" y="1354" text-anchor="middle" class="small">DB .10 / Archive .11</text>
  <text x="1670" y="1376" text-anchor="middle" class="small">192.168.60.0/28</text>

  <!-- Native VLAN and link legend -->
  <rect x="30" y="1235" width="510" height="80" rx="8" class="native"/>
  <text x="55" y="1267" class="box-title">Native / Unused VLAN 99</text>
  <text x="55" y="1294" class="box-text">Native trunk VLAN and shutdown unused ports - no user hosts</text>

  <line x1="600" y1="1260" x2="690" y2="1260" class="trunk"/>
  <text x="710" y="1266" class="box-text">Primary trunk or routed link</text>
  <line x1="600" y1="1300" x2="690" y2="1300" class="redundant"/>
  <text x="710" y="1306" class="box-text">Redundant trunk path</text>

  <!-- VLAN summary -->
  <rect x="30" y="1350" width="1280" height="105" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
  <text x="55" y="1382" class="box-title">VLAN and subnet summary</text>
  <text x="55" y="1412" class="box-text">VLAN 10 Marketing 192.168.10.0/27   |   VLAN 20 Sales 192.168.20.0/26   |   VLAN 30 Support 192.168.30.0/27</text>
  <text x="55" y="1440" class="box-text">VLAN 40 Servers 192.168.40.0/27   |   VLAN 50 Management 192.168.50.0/28   |   VLAN 60 Backup 192.168.60.0/28   |   VLAN 99 Native/Unused</text>
</svg>
